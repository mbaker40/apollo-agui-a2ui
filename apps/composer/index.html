<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: env(safe-area-inset-*) stays 0 without it (§7b tab bar). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%236d28d9%22/><text x=%2250%22 y=%2270%22 font-size=%2254%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22>A2</text></svg>"
    />
    <title>A2UI Composer</title>
    <!-- Shell theme: applied to <html> before React mounts to avoid a flash. -->
    <script>
      (function () {
        var theme = 'light';
        try {
          if (localStorage.getItem('composerx.theme') === 'dark') theme = 'dark';
        } catch (e) {
          /* storage unavailable; keep light */
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>
      /* Brand ground colors inline so the first paint is already on-brand. */
      html {
        background: #faf9f7;
      }
      html[data-theme='dark'] {
        background: #17131f;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
