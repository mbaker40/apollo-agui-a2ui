[project]
name = "mwe-agent"
version = "0.1.0"
description = "AG-UI agent service with a scripted (deterministic, keyless) model"
requires-python = ">=3.11"
dependencies = [
    "ag-ui-protocol>=0.1.21,<0.2",
    "fastapi>=0.141,<1",
    "uvicorn>=0.52,<1",
    "pyjwt>=2.13,<3",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.16,<0.17",
    "mypy>=1.14",
    "jsonschema>=4.26,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
